# Continuous integration: on every push and pull request to main,
# GitHub checks the code format, builds the whole solution and runs all tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you start the run by hand from the Actions tab

jobs:
  build-and-test:
    # Windows, because the WPF client (and its tests) only builds on Windows
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Quality check 1: code style. CSharpier is listed in .config/dotnet-tools.json
      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check code format (CSharpier)
        run: dotnet csharpier check .

      - name: Restore NuGet packages
        run: dotnet restore SmartBite.slnx

      # Quality check 2: any compiler warning fails the build
      - name: Build
        run: dotnet build SmartBite.slnx --configuration Release --no-restore -warnaserror

      # Tests use an in-memory database and a fake OpenRouter, so no PostgreSQL or API key is needed
      - name: Run tests
        run: dotnet test SmartBite.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Save test results
        if: always() # keep the report even when tests fail
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults
